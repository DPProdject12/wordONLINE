<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Редактор документов</title>
<style>
  :root{
    --bg:#eceff4; --sheet:#fff; --line:#dcdfe4; --ink:#1f2430;
    --muted:#6b7280; --accent:#2f6fed;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    min-height:100vh;
  }

  /* ---------- панель ---------- */
  .toolbar{
    position:sticky; top:0; z-index:20;
    background:#fff; border-bottom:1px solid var(--line);
    padding:8px 16px; display:flex; flex-direction:column; gap:6px;
  }
  .row{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
  .sep{width:1px; height:22px; background:var(--line); margin:0 4px}
  .tb{
    border:1px solid transparent; background:transparent; border-radius:6px;
    min-width:32px; height:32px; padding:0 8px; cursor:pointer;
    font-size:14px; color:var(--ink); display:inline-flex; align-items:center;
    justify-content:center; gap:5px; transition:.12s;
  }
  .tb:hover{background:#f1f3f7; border-color:var(--line)}
  .tb:active{background:#e6e9f0}
  .tb.on{background:#e8efff; border-color:#c3d6ff; color:var(--accent)}
  .tb.wide{font-size:13px; padding:0 12px}
  .tb.primary{background:var(--accent); color:#fff; border-color:var(--accent); font-size:13px; padding:0 14px}
  .tb.primary:hover{background:#1f5ad4}
  .tb.soft{background:#f6f7f9; border-color:var(--line); font-size:13px; padding:0 12px}

  select.tb{appearance:none; padding:0 6px; cursor:pointer}
  input.title{
    border:none; outline:none; font-size:15px; font-weight:600;
    color:var(--ink); background:transparent; width:230px; padding:4px 6px;
    border-radius:6px;
  }
  input.title:hover, input.title:focus{background:#f1f3f7}
  input[type=file]{display:none}

  /* ---------- лист ---------- */
  .canvas{padding:28px 16px 80px; display:flex; justify-content:center}
  .sheet{
    background:var(--sheet); width:100%; max-width:820px; min-height:60vh;
    padding:56px 64px; box-shadow:0 1px 3px rgba(16,24,40,.10),0 12px 32px rgba(16,24,40,.07);
    border-radius:4px;
  }
  #editor{
    outline:none; font-family:Georgia,"Times New Roman",serif;
    font-size:16px; line-height:1.65; min-height:50vh;
    word-wrap:break-word;
  }
  #editor:empty:before{
    content:attr(data-ph); color:#a9b0bd; pointer-events:none;
  }
  #editor img{
    max-width:100%; height:auto; border-radius:2px; vertical-align:bottom;
    cursor:default;
  }
  #editor img.selected{outline:2px solid var(--accent); outline-offset:2px}
  #editor h1{font-size:28px; line-height:1.25; margin:.8em 0 .45em; font-weight:700}
  #editor h2{font-size:22px; line-height:1.3; margin:.8em 0 .4em; font-weight:700}
  #editor h3{font-size:18px; line-height:1.35; margin:.8em 0 .35em; font-weight:700}
  #editor p{margin:0 0 .75em}
  #editor ul,#editor ol{margin:0 0 .75em; padding-left:1.5em}
  #editor li{margin:.15em 0}
  #editor blockquote{border-left:3px solid var(--line); margin:.6em 0; padding:.1em 0 .1em 16px; color:#4b5563; font-style:italic}
  #editor hr{border:none; border-top:1px solid var(--line); margin:1.2em 0}

  .statusbar{
    position:fixed; bottom:0; left:0; right:0; background:#fff;
    border-top:1px solid var(--line); font-size:12px; color:var(--muted);
    padding:7px 16px; display:flex; justify-content:space-between; gap:12px;
  }
  .statusbar b{color:var(--ink); font-weight:600}
  .hint{color:var(--muted); font-size:12.5px}

  @media (max-width:700px){
    .sheet{padding:28px 20px}
    input.title{width:130px}
    .tb.wide span{display:none}
  }

  /* ---------- печать / PDF ---------- */
  @page{size:A4; margin:2cm}
  @media print{
    body{background:#fff}
    .toolbar,.statusbar{display:none !important}
    .canvas{padding:0; display:block}
    .sheet{box-shadow:none; max-width:none; padding:0; border-radius:0; min-height:0}
    #editor{font-size:12pt; line-height:1.55; min-height:0}
    #editor img{max-width:100%}
    #editor blockquote{color:#333}
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="row">
    <input class="title" id="docTitle" value="Документ без названия" spellcheck="false">
    <span class="sep"></span>
    <button class="tb" data-cmd="undo" title="Отменить (Ctrl+Z)">↶</button>
    <button class="tb" data-cmd="redo" title="Повторить (Ctrl+Y)">↷</button>
    <span class="sep"></span>
    <button class="tb" data-cmd="bold" title="Жирный (Ctrl+B)"><b>B</b></button>
    <button class="tb" data-cmd="italic" title="Курсив (Ctrl+I)"><i>I</i></button>
    <button class="tb" data-cmd="underline" title="Подчёркнутый (Ctrl+U)"><u>U</u></button>
    <button class="tb" data-cmd="strikeThrough" title="Зачёркнутый"><s>S</s></button>
    <span class="sep"></span>
    <select class="tb" id="sizeSel" title="Размер шрифта">
      <option value="">Размер</option>
      <option value="1">8</option><option value="2">10</option>
      <option value="3">12</option><option value="4">14</option>
      <option value="5">18</option><option value="6">24</option>
      <option value="7">36</option>
    </select>
    <input type="color" class="tb" id="colorPick" value="#1f2430" title="Цвет текста" style="padding:2px;width:36px">
  </div>

  <div class="row">
    <button class="tb" data-block="h1" title="Заголовок 1">H1</button>
    <button class="tb" data-block="h2" title="Заголовок 2">H2</button>
    <button class="tb" data-block="h3" title="Заголовок 3">H3</button>
    <button class="tb" data-block="p" title="Обычный текст">¶</button>
    <span class="sep"></span>
    <button class="tb" data-cmd="insertUnorderedList" title="Маркированный список">•—</button>
    <button class="tb" data-cmd="insertOrderedList" title="Нумерованный список">1.</button>
    <button class="tb" data-cmd="formatBlock" data-val="blockquote" title="Цитата">❝</button>
    <span class="sep"></span>
    <button class="tb" data-cmd="justifyLeft" title="По левому краю">⇤</button>
    <button class="tb" data-cmd="justifyCenter" title="По центру">↔</button>
    <button class="tb" data-cmd="justifyRight" title="По правому краю">⇥</button>
    <span class="sep"></span>
    <button class="tb" id="btnImg" title="Вставить изображение">🖼 <span class="hint" style="font-size:12px">Картинка</span></button>
    <input type="file" id="imgInput" accept="image/*" multiple>
    <button class="tb" id="btnClear" title="Очистить форматирование">✕ Формат</button>
  </div>

  <div class="row">
    <button class="tb soft" id="btnOpen" title="Открыть сохранённый проект (.html)">📂 <span>Открыть</span></button>
    <button class="tb soft" id="btnSaveProj" title="Сохранить проект, чтобы потом продолжить">🗂 <span>Проект</span></button>
    <span class="sep"></span>
    <button class="tb primary" id="btnDocx" title="Скачать файл Word">⬇ DOCX</button>
    <button class="tb primary" id="btnPdf" title="Сохранить как PDF">⬇ PDF</button>
    <span class="sep"></span>
    <span class="hint" id="autosaveNote">черновик сохраняется автоматически</span>
  </div>
</div>

<div class="canvas">
  <div class="sheet">
    <div id="editor" contenteditable="true" spellcheck="true"
         data-ph="Начните печатать. Картинки можно вставлять кнопкой, перетаскиванием или Ctrl+V — они войдут прямо в текст."></div>
  </div>
</div>

<div class="statusbar">
  <span><b id="statWords">0</b> слов · <b id="statChars">0</b> символов · <b id="statImgs">0</b> изображений</span>
  <span id="statMsg">Готово</span>
</div>

<script>
/* =========================================================
   1. Утилиты
   ========================================================= */
const $ = s => document.querySelector(s);
const editor = $('#editor');
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                       .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function dataUrlToBytes(url){
  const b64 = url.slice(url.indexOf(',') + 1);
  const bin = atob(b64);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}

function download(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* =========================================================
   2. Минимальный ZIP-писатель (docx — это zip)
   ========================================================= */
const CRC_T = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(u8){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function makeZip(files){
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;
  const d = new Date();
  const dosTime = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF;
  const dosDate = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;

  for (const f of files){
    const name = enc.encode(f.name);
    const data = f.data;
    const crc = crc32(data);

    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true);        // имена в UTF-8
    lh.setUint16(8, 0, true);             // без сжатия
    lh.setUint16(10, dosTime, true);
    lh.setUint16(12, dosDate, true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true);
    lh.setUint32(22, data.length, true);
    lh.setUint16(26, name.length, true);
    lh.setUint16(28, 0, true);
    chunks.push(new Uint8Array(lh.buffer), name, data);

    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true);
    cd.setUint16(4, 20, true);
    cd.setUint16(6, 20, true);
    cd.setUint16(8, 0x0800, true);
    cd.setUint16(10, 0, true);
    cd.setUint16(12, dosTime, true);
    cd.setUint16(14, dosDate, true);
    cd.setUint32(16, crc, true);
    cd.setUint32(20, data.length, true);
    cd.setUint32(24, data.length, true);
    cd.setUint16(28, name.length, true);
    cd.setUint16(30, 0, true);
    cd.setUint16(32, 0, true);
    cd.setUint16(34, 0, true);
    cd.setUint16(36, 0, true);
    cd.setUint32(38, 0, true);
    cd.setUint32(42, offset, true);
    central.push(new Uint8Array(cd.buffer), name);

    offset += 30 + name.length + data.length;
  }

  let cdSize = 0;
  for (const c of central) cdSize += c.length;

  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true);
  eocd.setUint16(8, files.length, true);
  eocd.setUint16(10, files.length, true);
  eocd.setUint32(12, cdSize, true);
  eocd.setUint32(16, offset, true);

  return new Blob([...chunks, ...central, new Uint8Array(eocd.buffer)], {
    type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
  });
}

/* =========================================================
   3. HTML редактора → модель (абзацы + картинки)
   ========================================================= */
const BLOCKS = new Set(['P','DIV','H1','H2','H3','H4','H5','H6','LI','BLOCKQUOTE','PRE','SECTION','ARTICLE']);
const HEADINGS = { H1:24, H2:20, H3:16, H4:13, H5:11, H6:11 };
const LEGACY_SIZE = { 1:8, 2:10, 3:12, 4:14, 5:18, 6:24, 7:36 };

function rgbToHex(v){
  if (!v) return null;
  if (v[0] === '#') return v.toUpperCase();
  const m = v.match(/rgba?\((\d+)[,\s]+(\d+)[,\s]+(\d+)/i);
  if (!m) return null;
  const h = n => (+n).toString(16).padStart(2, '0');
  return ('#' + h(m[1]) + h(m[2]) + h(m[3])).toUpperCase();
}

function alignOf(el){
  const a = el.style && el.style.textAlign;
  return a === 'center' ? 'center' : a === 'right' ? 'right'
       : a === 'justify' ? 'both'  : null;
}

function extractModel(root){
  const paras = [], media = [];
  let cur = null;

  const open  = align => { cur = { align: align || null, runs: [] }; paras.push(cur); return cur; };
  const ensure = () => cur || open(null);
  const push  = r => ensure().runs.push(r);

  function pushImage(img){
    const src = img.getAttribute('src') || '';
    const m = /^data:image\/([a-z0-9.+-]+);base64,/i.exec(src);
    if (!m) return;
    let ext = m[1].toLowerCase();
    if (ext === 'jpg') ext = 'jpeg';
    if (ext === 'svg+xml') return;

    let w = img.naturalWidth || 400, h = img.naturalHeight || 300;
    const MAXW = 580;
    if (w > MAXW){ h = Math.round(h * MAXW / w); w = MAXW; }

    media.push({ index: media.length, ext, data: dataUrlToBytes(src) });
    push({ kind: 'img', idx: media.length - 1, w, h, ext });
  }

  function walkText(node, fmt){
    const t = node.nodeValue.replace(/\u00a0/g, ' ').replace(/\r/g, '');
    if (!t) return;
    if (!cur && !t.trim()) return;
    t.split('\n').forEach((part, i) => {
      if (i > 0) push({ kind: 'br' });
      if (part) push({ kind: 't', text: part, fmt });
    });
  }

  function walkChildren(el, fmt){
    for (const c of el.childNodes) walk(c, fmt);
  }

  function walk(node, fmt){
    if (node.nodeType === 3){ walkText(node, fmt); return; }
    if (node.nodeType !== 1) return;

    const tag = node.tagName;
    if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'TEMPLATE') return;
    if (tag === 'BR'){ push({ kind: 'br' }); return; }
    if (tag === 'IMG'){ pushImage(node); return; }
    if (tag === 'HR'){ push({ kind: 'hr' }); return; }

    if (tag === 'UL' || tag === 'OL'){
      [...node.children].filter(c => c.tagName === 'LI').forEach((li, i) => {
        open(alignOf(li));
        push({ kind: 't', text: tag === 'OL' ? (i + 1) + '. ' : '• ', fmt });
        walkChildren(li, fmt);
        cur = null;
      });
      return;
    }

    if (tag === 'TABLE'){
      for (const tr of node.querySelectorAll('tr')){
        open(null);
        const cells = [...tr.children].map(td => td.textContent.trim());
        push({ kind: 't', text: cells.join('   |   '), fmt });
        cur = null;
      }
      return;
    }

    if (BLOCKS.has(tag)){
      let f = fmt;
      if (HEADINGS[tag]) f = { ...f, bold: true, size: HEADINGS[tag] };
      open(alignOf(node));
      walkChildren(node, f);
      cur = null;
      return;
    }

    // инлайновые элементы
    let f2 = fmt;
    if (tag === 'B' || tag === 'STRONG') f2 = { ...f2, bold: true };
    if (tag === 'I' || tag === 'EM')     f2 = { ...f2, italic: true };
    if (tag === 'U')                     f2 = { ...f2, underline: true };
    if (tag === 'S' || tag === 'STRIKE' || tag === 'DEL') f2 = { ...f2, strike: true };

    if (tag === 'FONT'){
      const s = parseInt(node.getAttribute('size') || '', 10);
      if (LEGACY_SIZE[s]) f2 = { ...f2, size: LEGACY_SIZE[s] };
      const c = rgbToHex(node.getAttribute('color'));
      if (c) f2 = { ...f2, color: c };
    }

    const st = node.style;
    if (st){
      const fw = st.fontWeight;
      if (fw === 'bold' || fw === 'bolder' || parseInt(fw, 10) >= 600) f2 = { ...f2, bold: true };
      if (st.fontStyle === 'italic') f2 = { ...f2, italic: true };
      const deco = (st.textDecoration || '') + ' ' + (st.textDecorationLine || '');
      if (deco.includes('underline')) f2 = { ...f2, underline: true };
      if (deco.includes('line-through')) f2 = { ...f2, strike: true };
      const c = rgbToHex(st.color);
      if (c) f2 = { ...f2, color: c };
      if (st.fontSize){
        const px = parseFloat(st.fontSize);
        if (px) f2 = { ...f2, size: Math.round(px * 0.75) };
      }
    }

    walkChildren(node, f2);
  }

  walkChildren(root, {});
  return { paras, media };
}

/* =========================================================
   4. Модель → WordprocessingML → .docx
   ========================================================= */
const NS = [
  'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"',
  'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"',
  'xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"',
  'xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"',
  'xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"'
].join(' ');

function runXml(r){
  if (r.kind === 'br') return '<w:r><w:br/></w:r>';
  if (r.kind === 'hr') return '<w:r><w:t>─────────────</w:t></w:r>';

  if (r.kind === 'img'){
    const rid = 'rIdImg' + (r.idx + 1);
    const cx = Math.round(r.w * 9525), cy = Math.round(r.h * 9525);
    const id = r.idx + 1;
    return `<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0">`
      + `<wp:extent cx="${cx}" cy="${cy}"/>`
      + `<wp:docPr id="${id}" name="Picture ${id}"/>`
      + `<a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">`
      + `<pic:pic><pic:nvPicPr><pic:cNvPr id="${id}" name="image${id}.${r.ext}"/><pic:cNvPicPr/></pic:nvPicPr>`
      + `<pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>`
      + `<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm>`
      + `<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic>`
      + `</a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;
  }

  const f = r.fmt || {};
  let rPr = '';
  if (f.bold) rPr += '<w:b/>';
  if (f.italic) rPr += '<w:i/>';
  if (f.underline) rPr += '<w:u w:val="single"/>';
  if (f.strike) rPr += '<w:strike/>';
  if (f.color) rPr += `<w:color w:val="${f.color.replace('#', '')}"/>`;
  const sz = Math.round((f.size || 11) * 2);
  rPr += `<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/>`;

  return `<w:r>${rPr ? '<w:rPr>' + rPr + '</w:rPr>' : ''}`
       + `<w:t xml:space="preserve">${esc(r.text)}</w:t></w:r>`;
}

function paraXml(p){
  let pPr = '';
  if (p.align) pPr += `<w:jc w:val="${p.align}"/>`;
  if (p.align === 'center') pPr += '<w:ind w:firstLine="0"/>';
  const head = pPr ? `<w:pPr>${pPr}</w:pPr>` : '';
  const body = p.runs.map(runXml).join('');
  return `<w:p>${head}${body}</w:p>`;
}

function buildDocx(){
  const { paras, media } = extractModel(editor);
  const content = paras.length ? paras.map(paraXml).join('') : '<w:p/>';

  const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document ${NS}><w:body>${content}
<w:sectPr><w:pgSz w:w="11906" w:h="16838"/>
<w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="708" w:footer="708" w:gutter="0"/>
</w:sectPr></w:body></w:document>`;

  const types = ['png','jpeg','gif','webp','bmp']
    .map(e => `<Default Extension="${e}" ContentType="image/${e === 'jpg' ? 'jpeg' : e}"/>`).join('');

  const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
${types}
<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`;

  const rootRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;

  const imgRels = media.map(m =>
    `<Relationship Id="rIdImg${m.index + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/image${m.index + 1}.${m.ext}"/>`
  ).join('');

  const docRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${imgRels}</Relationships>`;

  const enc = new TextEncoder();
  const files = [
    { name: '[Content_Types].xml', data: enc.encode(contentTypes) },
    { name: '_rels/.rels', data: enc.encode(rootRels) },
    { name: 'word/document.xml', data: enc.encode(documentXml) },
    { name: 'word/_rels/document.xml.rels', data: enc.encode(docRels) },
    ...media.map(m => ({ name: `word/media/image${m.index + 1}.${m.ext}`, data: m.data }))
  ];

  return makeZip(files);
}

/* =========================================================
   5. Скачивание
   ========================================================= */
function baseName(){
  const n = ($('#docTitle').value || 'документ').trim().replace(/[\\/:*?"<>|]+/g, '_');
  return n || 'документ';
}

function saveDocx(){
  const blob = buildDocx();
  download(blob, baseName() + '.docx');
  msg('Файл Word сохранён');
}

function savePdf(){
  const content = editor.innerHTML || '<p></p>';
  const title = esc(baseName());
  const html = `<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>${title}</title>
<style>
  @page{size:A4;margin:2cm}
  body{font-family:Georgia,"Times New Roman",serif;font-size:12pt;line-height:1.55;color:#000;margin:0}
  img{max-width:100%;height:auto}
  p{margin:0 0 .75em}
  h1{font-size:20pt;margin:.7em 0 .4em}
  h2{font-size:16pt;margin:.7em 0 .35em}
  h3{font-size:13.5pt;margin:.7em 0 .3em}
  ul,ol{padding-left:1.5em;margin:0 0 .75em}
  blockquote{border-left:3px solid #ccc;margin:.6em 0;padding-left:14px;color:#333;font-style:italic}
  hr{border:none;border-top:1px solid #ccc;margin:1em 0}
</style></head><body>${content}</body></html>`;

  const frame = document.createElement('iframe');
  frame.style.cssText = 'position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0';
  document.body.appendChild(frame);
  const d = frame.contentWindow.document;
  d.open(); d.write(html); d.close();

  setTimeout(() => {
    try {
      frame.contentWindow.focus();
      frame.contentWindow.print();
    } catch (e) {
      msg('Не удалось открыть печать');
    }
    setTimeout(() => frame.remove(), 1500);
  }, 400);

  msg('В окне печати выберите «Сохранить как PDF»');
}

/* =========================================================
   6. Сохранить / открыть проект
   ========================================================= */
function saveProject(){
  const title = esc(baseName());
  const html = `<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>${title}</title>
<style>
  body{background:#eceff4;margin:0;padding:28px;font-family:Georgia,serif}
  .sheet{background:#fff;max-width:820px;margin:0 auto;padding:56px 64px;box-shadow:0 2px 20px rgba(0,0,0,.08)}
  #doc-content{font-size:16px;line-height:1.65}
  #doc-content img{max-width:100%;height:auto}
  @media print{body{padding:0;background:#fff}.sheet{box-shadow:none;padding:0;max-width:none}}
</style></head><body><div class="sheet"><div id="doc-content">${editor.innerHTML}</div></div></body></html>`;

  download(new Blob([html], { type: 'text/html;charset=utf-8' }), baseName() + '.html');
  msg('Проект сохранён (открывается кнопкой «Открыть»)');
}

function openProject(file){
  const reader = new FileReader();
  reader.onload = e => {
    const text = String(e.target.result);
    if (/\.txt$/i.test(file.name)){
      editor.innerHTML = text.split(/\n{2,}/)
        .map(p => '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>').join('');
    } else {
      const doc = new DOMParser().parseFromString(text, 'text/html');
      const node = doc.querySelector('#doc-content') || doc.querySelector('#editor') || doc.body;
      editor.innerHTML = node ? node.innerHTML : text;
      const t = doc.querySelector('title');
      if (t && t.textContent.trim()) $('#docTitle').value = t.textContent.trim();
    }
    refresh();
    msg('Документ открыт');
  };
  reader.readAsText(file, 'utf-8');
}

/* =========================================================
   7. Картинки
   ========================================================= */
function normalizeImage(file){
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const src = e.target.result;
      if (/^data:image\/(png|jpeg);base64,/i.test(src)){
        resolve(src);
      } else {
        const img = new Image();
        img.onload = () => {
          const c = document.createElement('canvas');
          c.width = img.naturalWidth; c.height = img.naturalHeight;
          c.getContext('2d').drawImage(img, 0, 0);
          resolve(c.toDataURL('image/png'));
        };
        img.onerror = () => resolve(null);
        img.src = src;
      }
    };
    reader.readAsDataURL(file);
  });
}

async function insertFiles(files){
  const imgs = [...files].filter(f => /^image\//.test(f.type));
  if (!imgs.length) return;

  for (const file of imgs){
    const src = await normalizeImage(file);
    if (!src) continue;
    const img = document.createElement('img');
    img.src = src;
    img.style.maxWidth = '100%';
    insertNode(img);
  }
  refresh();
  msg('Изображение вставлено');
}

function insertNode(node){
  editor.focus();
  const sel = window.getSelection();
  if (sel && sel.rangeCount && editor.contains(sel.anchorNode)){
    const range = sel.getRangeAt(0);
    range.deleteContents();
    range.insertNode(node);
    range.setStartAfter(node);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
  } else {
    editor.appendChild(node);
  }
  editor.appendChild(document.createElement('br'));
}

/* =========================================================
   8. Панель инструментов
   ========================================================= */
$('#docTitle').addEventListener('focus', function(){ this.select(); });

document.querySelectorAll('.tb[data-cmd]').forEach(btn => {
  btn.addEventListener('mousedown', e => e.preventDefault());
  btn.addEventListener('click', () => {
    editor.focus();
    const cmd = btn.dataset.cmd;
    const val = btn.dataset.val || null;
    document.execCommand(cmd, false, val);
    refresh();
  });
});

document.querySelectorAll('.tb[data-block]').forEach(btn => {
  btn.addEventListener('mousedown', e => e.preventDefault());
  btn.addEventListener('click', () => {
    editor.focus();
    let tag = btn.dataset.block;
    const cur = (document.queryCommandValue('formatBlock') || '').toLowerCase();
    if (cur === tag) tag = 'p';
    document.execCommand('formatBlock', false, tag);
    refresh();
  });
});

$('#sizeSel').addEventListener('change', e => {
  const v = e.target.value;
  if (!v) return;
  editor.focus();
  document.execCommand('styleWithCSS', false, false);
  document.execCommand('fontSize', false, v);
  e.target.value = '';
  refresh();
});

$('#colorPick').addEventListener('input', e => {
  editor.focus();
  document.execCommand('styleWithCSS', false, true);
  document.execCommand('foreColor', false, e.target.value);
  refresh();
});

$('#btnClear').addEventListener('click', () => {
  editor.focus();
  document.execCommand('removeFormat', false, null);
  document.execCommand('formatBlock', false, 'p');
  refresh();
});

$('#btnImg').addEventListener('click', () => $('#imgInput').click());
$('#imgInput').addEventListener('change', e => {
  insertFiles(e.target.files);
  e.target.value = '';
});

$('#btnDocx').addEventListener('click', saveDocx);
$('#btnPdf').addEventListener('click', savePdf);
$('#btnSaveProj').addEventListener('click', saveProject);

const openInput = (() => {
  const i = document.createElement('input');
  i.type = 'file';
  i.accept = '.html,.htm,.txt';
  i.addEventListener('change', e => {
    if (e.target.files[0]) openProject(e.target.files[0]);
    e.target.value = '';
  });
  document.body.appendChild(i);
  return i;
})();
$('#btnOpen').addEventListener('click', () => openInput.click());

/* =========================================================
   9. Вставка, перетаскивание, автосохранение, статистика
   ========================================================= */
editor.addEventListener('paste', e => {
  const items = e.clipboardData && e.clipboardData.items;
  if (items){
    const imgs = [...items].filter(i => i.kind === 'file' && /^image\//.test(i.type));
    if (imgs.length){
      e.preventDefault();
      insertFiles(imgs.map(i => i.getAsFile()).filter(Boolean));
      return;
    }
  }
  // вставка HTML чистим от опасных тегов
  const html = e.clipboardData && e.clipboardData.getData('text/html');
  if (html){
    e.preventDefault();
    const clean = html
      .replace(/<(script|style|iframe|meta|link)[\s\S]*?<\/\1>/gi, '')
      .replace(/ on[a-z]+="[^"]*"/gi, '')
      .replace(/ on[a-z]+='[^']*'/gi, '');
    document.execCommand('insertHTML', false, clean);
    refresh();
  }
});

editor.addEventListener('dragover', e => { e.preventDefault(); });
editor.addEventListener('drop', e => {
  if (e.dataTransfer && e.dataTransfer.files.length){
    e.preventDefault();
    insertFiles(e.dataTransfer.files);
  }
});

let saveTimer;
editor.addEventListener('input', () => {
  refresh();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(autosave, 600);
});

function autosave(){
  try {
    localStorage.setItem('syntx_doc_html', editor.innerHTML);
    localStorage.setItem('syntx_doc_title', $('#docTitle').value);
  } catch (e){
    $('#autosaveNote').textContent = 'черновик слишком большой для автосохранения';
  }
}

function refresh(){
  const text = editor.innerText || '';
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  $('#statWords').textContent = words;
  $('#statChars').textContent = text.length;
  $('#statImgs').textContent = editor.querySelectorAll('img').length;

  document.querySelectorAll('.tb[data-cmd]').forEach(b => {
    try { b.classList.toggle('on', document.queryCommandState(b.dataset.cmd)); } catch (e) {}
  });
}

function msg(t){
  const el = $('#statMsg');
  el.textContent = t;
  clearTimeout(msg._t);
  msg._t = setTimeout(() => { el.textContent = 'Готово'; }, 4000);
}

// горячие клавиши для экспорта
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){
    e.preventDefault();
    saveDocx();
  }
});

// настройки редактора и восстановление черновика
document.execCommand('styleWithCSS', false, true);
document.execCommand('defaultParagraphSeparator', false, 'p');

window.addEventListener('load', () => {
  const saved = localStorage.getItem('syntx_doc_html');
  const savedTitle = localStorage.getItem('syntx_doc_title');
  if (saved){
    editor.innerHTML = saved;
    if (savedTitle) $('#docTitle').value = savedTitle;
    msg('Черновик восстановлен');
  }
  refresh();
});

$('#docTitle').addEventListener('input', () => {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(autosave, 600);
});
</script>
